<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <desc>Tumbler glass with three ice cubes, two bearing the initials D and A.</desc>
  <!-- Geometry mirrors DaIceGlyph.tsx exactly. A favicon cannot inherit
       currentColor, so these hex values are the resolved light theme ink and
       canvas tokens from globals.css. A single fixed pair: on dark browser
       chrome the mark is dimmer but still legible, and it stays identical to
       the nav glyph everywhere.
       NB: XML comments may not contain a double hyphen, so CSS custom property
       names are spelled out here rather than written with their prefix. -->
  <g fill="none" stroke="#0d1710">
    <path d="M 10 16 L 14 56 L 50 56 L 54 16" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="32" cy="16" rx="22" ry="3" stroke-width="1.6"/>
    <g stroke-width="1" opacity=".5">
      <line x1="20" y1="20" x2="22" y2="50"/>
      <line x1="32" y1="20" x2="32" y2="52"/>
      <line x1="44" y1="20" x2="42" y2="50"/>
    </g>
  </g>
  <g fill="#0d1710" opacity=".92">
    <rect x="23" y="23" width="16" height="16" rx="2.5"/>
    <rect x="15" y="37" width="16" height="16" rx="2.5"/>
    <rect x="32" y="40" width="16" height="16" rx="2.5"/>
  </g>
  <g fill="#fcfdfb" font-size="11" font-weight="700" text-anchor="middle"
     font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="23" y="49">D</text>
    <text x="40" y="52">A</text>
  </g>
</svg>
