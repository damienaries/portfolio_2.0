name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches .nvmrc, netlify.toml NODE_VERSION and package.json engines,
          # so CI fails for the same reasons a deploy would.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The build is the real test: it typechecks every route, resolves the
      # Tailwind scan and catches the App Router / Pages Router conflicts that
      # nothing else surfaces.
      - name: Build
        run: npm run build
